services:

  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bierliste}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5431}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      # All variables are injected from this file into the container environment.
      # env/.env is gitignored — copy env/.env.example and fill in real values.
      - ./env/.env
    environment:
      # DB_HOST overrides the value in env/.env so the backend resolves to the
      # postgres service on the Docker network instead of localhost.
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

openapi: 3.0.3
info:
  title: Bierliste Backend API
  version: 0.3.0
  description: |
    REST API for the Kickerliste office foosball score tracker.

    ## Authentication
    Most endpoints require a JWT passed as `Authorization: Bearer <token>`.
    Tokens are obtained from `POST /auth/login`.

    Tokens issued for admin-created accounts carry `forcePasswordChange: true`.
    Those accounts may only call `POST /auth/change-password` until a new
    password is set; all other protected endpoints return `403` until then.

    ## Account activation
    Self-registered accounts (`POST /auth/register`) start as **inactive** and
    cannot log in until an admin activates them via `PATCH /users/:id/activate`.
    Attempting to log in with an inactive account returns `403`.

    Admin-created accounts (`POST /users`) are active immediately.

    ## Roles
    Endpoints marked **admin only** require the `role: "admin"` claim in the
    JWT. A valid token with `role: "user"` returns `403`.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: auth
    description: Authentication and credential management
  - name: users
    description: User accounts (admin-managed)
  - name: teams
    description: Teams and team membership
  - name: fixtures
    description: Match fixtures (submit, review, approve/reject)
  - name: score-adjustments
    description: Manual score adjustments applied by admins

security: []   # default — individual operations opt in via security field

paths:

  # ------------------------------------------------------------------ auth

  /auth/login:
    post:
      tags: [auth]
      summary: Log in and obtain a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK — returns a signed JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account exists but has not been activated by an admin yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/register:
    post:
      tags: [auth]
      summary: Self-register a new account
      description: |
        Creates an **inactive** user account with `role: "user"` and
        `forcePasswordChange: false`. No JWT is issued — the account must be
        activated by an admin via `PATCH /users/:id/activate` before the user
        can log in.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created — account pending admin activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/change-password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      description: |
        Available to any authenticated user, including those with
        `forcePasswordChange: true`. On success returns a fresh JWT with
        `forcePasswordChange: false`.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: OK — returns a fresh JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ users

  /users:
    get:
      tags: [users]
      summary: List users with their total scores
      description: |
        Returns active users by default. Pass `?active=false` to list accounts
        that are pending admin activation.
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: active
          in: query
          required: false
          description: |
            Filter by activation status. Defaults to `true` (active users only).
            Pass `false` to list accounts awaiting activation.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Invalid value for `active` parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [users]
      summary: Create a user account (admin only)
      description: |
        Admin-created accounts are assigned `role: "user"` and have
        `forcePasswordChange: true` set in their JWT. The user must call
        `POST /auth/change-password` before accessing any other endpoint.
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [users]
      summary: Get a user by ID
      operationId: getUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [users]
      summary: Update a user's username
      operationId: updateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [users]
      summary: Delete a user
      operationId: deleteUser
      security:
        - BearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/role:
    parameters:
      - $ref: "#/components/parameters/id"

    patch:
      tags: [users]
      summary: Change a user's role (admin only)
      description: |
        Updates the `role` field on an existing account. Returns the updated
        user object. Use this to promote a user to admin or demote an admin
        back to user.
      operationId: updateUserRole
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: OK — returns the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/id"

    patch:
      tags: [users]
      summary: Activate a pending user account (admin only)
      description: |
        Sets `active = true` on the account, allowing the user to log in.
        Typically called after reviewing a self-registered account.
      operationId: activateUser
      security:
        - BearerAuth: []
      responses:
        "204":
          description: No Content — account is now active
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/adjustments:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [score-adjustments]
      summary: List manual score adjustments for a user (admin only)
      operationId: listAdjustments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreAdjustment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [score-adjustments]
      summary: Apply a manual score adjustment to a user (admin only)
      description: |
        `amount` may be negative (penalty) or positive (bonus) but must not be zero.
      operationId: createAdjustment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdjustmentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreAdjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Amount must not be zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ teams

  /teams:
    get:
      tags: [teams]
      summary: List all teams
      operationId: listTeams
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [teams]
      summary: Create a team
      operationId: createTeam
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [teams]
      summary: Get a team by ID
      operationId: getTeam
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [teams]
      summary: Update a team's name
      operationId: updateTeam
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [teams]
      summary: Delete a team (admin only — cascades to team_member rows)
      operationId: deleteTeam
      security:
        - BearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [teams]
      summary: List members of a team
      operationId: listTeamMembers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [teams]
      summary: Add a user to a team (max 2 members enforced at application layer)
      operationId: addTeamMember
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTeamMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User already on team or team is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /teams/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: userId
        in: path
        required: true
        schema:
          type: integer

    delete:
      tags: [teams]
      summary: Remove a user from a team (admin only)
      operationId: removeTeamMember
      security:
        - BearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- fixtures

  /fixtures:
    get:
      tags: [fixtures]
      summary: List fixtures
      description: |
        Returns fixtures ordered newest first. When `status` is omitted, fixtures
        of all statuses are returned. Use `?status=approved` to restrict to
        approved fixtures only (e.g. for a scoreboard view).
      operationId: listFixtures
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: query
          required: false
          description: Filter fixtures that involve this team (either side)
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: |
            Filter by fixture status. Returns all statuses when omitted.
          schema:
            $ref: "#/components/schemas/FixtureStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fixture"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [fixtures]
      summary: Submit a new fixture for admin approval
      description: |
        Creates a fixture with `status: "pending"`. The authenticated user is
        recorded as `submittedBy`. An admin must approve it before it counts
        toward scores.

        `playedAt` defaults to the current server time when omitted.
        `team1Score` and `team2Score` must either both be provided or both be omitted.
      operationId: createFixture
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFixtureRequest"
      responses:
        "201":
          description: Created — fixture is pending admin review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixture"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error (same team on both sides, or only one score provided)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /fixtures/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [fixtures]
      summary: Get a fixture by ID (any status)
      operationId: getFixture
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixture"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [fixtures]
      summary: Update a fixture (result, scores, value)
      description: |
        `team1Score` and `team2Score` must either both be provided or both be omitted.
      operationId: updateFixture
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFixtureRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixture"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error (only one score provided)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [fixtures]
      summary: Delete a fixture
      operationId: deleteFixture
      security:
        - BearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /fixtures/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/id"

    patch:
      tags: [fixtures]
      summary: Approve a pending fixture (admin only)
      description: |
        Transitions the fixture from `pending` to `approved`. The fixture will
        now appear in `GET /fixtures` and contribute to player scores.
        Returns `409` if the fixture is not currently `pending`.
      operationId: approveFixture
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK — returns the updated fixture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixture"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Fixture is not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /fixtures/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/id"

    patch:
      tags: [fixtures]
      summary: Reject a pending fixture (admin only)
      description: |
        Transitions the fixture from `pending` to `rejected`. The record is
        preserved for audit purposes but does not count toward scores.
        Returns `409` if the fixture is not currently `pending`.
      operationId: rejectFixture
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK — returns the updated fixture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixture"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Fixture is not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# ======================================================= components

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256-signed JWT. Obtain a token from `POST /auth/login`.
        Pass as `Authorization: Bearer <token>`.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Bad request — malformed JSON or failed field validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorised (wrong role, or forcePasswordChange is true)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    # ---- domain enums

    Role:
      type: string
      enum: [admin, user]

    MatchResult:
      type: string
      enum: [team_1, team_2, draw]

    FixtureStatus:
      type: string
      enum: [pending, approved, rejected]
      description: |
        - `pending` — submitted, awaiting admin review
        - `approved` — counted toward player scores
        - `rejected` — reviewed but excluded from scores (record preserved for audit)

    # ---- entities (read models)

    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
          readOnly: true
        active:
          type: boolean
          readOnly: true
          description: |
            `true` if the account has been activated and can log in.
            Self-registered accounts start as `false` until an admin calls
            `PATCH /users/:id/activate`. Admin-created accounts are `true`
            immediately.
        totalScore:
          type: number
          format: double
          readOnly: true
          description: |
            Derived from the user_total_score view; not stored on the row.
            Fixture values are split equally among team members, so a player
            on a 2-member team accrues ±value/2 per fixture. May be fractional
            when an odd value is split across a 2-player team.
      required: [id, username, role, active, totalScore]

    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required: [id, created_at]

    Fixture:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        team1Id:
          type: integer
        team2Id:
          type: integer
        result:
          $ref: "#/components/schemas/MatchResult"
        team1Score:
          type: integer
          nullable: true
        team2Score:
          type: integer
          nullable: true
        playedAt:
          type: string
          format: date-time
        value:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/FixtureStatus"
          readOnly: true
        submittedBy:
          type: integer
          nullable: true
          readOnly: true
          description: ID of the user who submitted this fixture
      required: [id, team1Id, team2Id, result, playedAt, value, status]

    ScoreAdjustment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        userId:
          type: integer
          readOnly: true
          description: The user whose score is adjusted
        amount:
          type: integer
          description: Positive for a bonus, negative for a penalty; never zero
        reason:
          type: string
          description: Human-readable explanation recorded by the admin
        createdBy:
          type: integer
          readOnly: true
          description: ID of the admin who applied the adjustment
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required: [id, userId, amount, reason, createdBy, createdAt]

    # ---- auth responses

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Signed JWT (HS256)
      required: [token]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ---- request bodies

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required: [username, password]

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 8
          writeOnly: true
      required: [username, password]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          writeOnly: true
      required: [currentPassword, newPassword]

    CreateUserRequest:
      type: object
      description: |
        Creates an account with `forcePasswordChange: true`. The user will be
        required to call `POST /auth/change-password` on first login.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 8
          writeOnly: true
      required: [username, password]

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
      required: [username]

    UpdateRoleRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
      required: [role]

    CreateTeamRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true

    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true

    AddTeamMemberRequest:
      type: object
      properties:
        userId:
          type: integer
      required: [userId]

    CreateFixtureRequest:
      type: object
      properties:
        team1Id:
          type: integer
        team2Id:
          type: integer
        result:
          $ref: "#/components/schemas/MatchResult"
        team1Score:
          type: integer
          nullable: true
          minimum: 0
        team2Score:
          type: integer
          nullable: true
          minimum: 0
        playedAt:
          type: string
          format: date-time
          description: Defaults to the current server time when omitted
        value:
          type: integer
          minimum: 0
          default: 0
      required: [team1Id, team2Id, result]

    UpdateFixtureRequest:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/MatchResult"
        team1Score:
          type: integer
          nullable: true
          minimum: 0
        team2Score:
          type: integer
          nullable: true
          minimum: 0
        value:
          type: integer
          minimum: 0
      required: [result]

    CreateAdjustmentRequest:
      type: object
      properties:
        amount:
          type: integer
          description: Points to add (positive) or deduct (negative); must not be zero
          not:
            enum: [0]
        reason:
          type: string
          minLength: 1
          description: Human-readable explanation for the adjustment
      required: [amount, reason]

    # ---- error envelope

    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]
